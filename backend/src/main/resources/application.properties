spring.application.name=novel

# Database Configuration (MariaDB)
spring.datasource.url=jdbc:mariadb://localhost:3306/novel_db?createDatabaseIfNotExist=true
spring.datasource.username=novel
spring.datasource.password=novel_pass
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Internationalization
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Server
server.port=8080
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
spring.threads.virtual.enabled=true

# Password Expiration Policy
app.security.password-expiration-days=90

# Logging Configuration
logging.file.name=logs/novel-app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
