spring.application.name=novel

# Database Configuration (MariaDB)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization
spring.sql.init.mode=${SQL_INIT_MODE}
spring.sql.init.schema-locations=file:backend/sql/create_tables.sql
spring.sql.init.data-locations=file:backend/sql/import_data.sql

# Internationalization
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Server
server.port=8080
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
server.servlet.session.timeout=30m
spring.threads.virtual.enabled=true

# Password Expiration Policy
app.security.password-expiration-days=90

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS_URL}
